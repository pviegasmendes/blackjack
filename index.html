<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Juego de Blackjack contra la computadora" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/styles.css" />
        <title>Blackjack</title>
    </head>

    <body>
        <header class="titulo">
            <h1><span class="palo">♠</span> Blackjack <span class="palo rojo">♥</span></h1>
            <p>Llega a 21 sin pasarte</p>
        </header>

        <main class="mesa">
            <form id="formulario" class="login">
                <h2>Bienvenido</h2>
                <label for="nombre">Ingresa tu nombre para comenzar</label>
                <input
                    type="text"
                    name="nombre"
                    id="nombre"
                    placeholder="Tu nombre"
                    autocomplete="off"
                    required
                />
                <button class="btn btn-gold" type="submit">Ingresar</button>
            </form>

            <div id="container" class="juego">
                <section class="zona">
                    <h2 class="zona-titulo">
                        <span id="playerName">Player</span>
                        <span class="marcador"><small>0</small> pts</span>
                    </h2>
                    <div id="jugador-cartas" class="cartas"></div>
                </section>

                <section class="zona">
                    <h2 class="zona-titulo">
                        <span>Computadora</span>
                        <span class="marcador"><small>0</small> pts</span>
                    </h2>
                    <div id="computadora-cartas" class="cartas"></div>
                </section>

                <div class="acciones">
                    <button id="btnNuevo" class="btn btn-ghost">Nuevo Juego</button>
                    <button id="btnPedir" class="btn btn-gold">Pedir Carta</button>
                    <button id="btnDetener" class="btn btn-light">Plantarse</button>
                </div>
            </div>
        </main>

        <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="assets/js/underscore-min.js"></script>
        <script src="assets/js/juego.js"></script>
    </body>
</html>
